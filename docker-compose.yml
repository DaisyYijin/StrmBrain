services:
  strmhub:
    # 方式一：使用 GitHub Actions 自动构建的镜像（推荐，无需本地构建）
    image: ghcr.io/daisyyijin/strmhub:latest

    # 方式二：本地构建（注释掉 image，取消注释 build）
    # build: .

    container_name: strmhub
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # 运行数据持久化（账号、Cookie、同步清单、备份等）
      - strmhub_data:/app/data
      # 核心配置持久化（settings.json、local_account.json、sync_schedule.json 等）
      - strmhub_config:/app/config
      # 日志持久化（运行日志文件）
      - strmhub_log:/app/log
      # STRM 文件输出目录（供 Emby/Jellyfin 等媒体服务器读取）
      - strmhub_media:/media
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - AUTH_ENABLED=true
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin123
      - SECRET_KEY=
      - CORS_ORIGINS=
      - TZ=Asia/Shanghai

volumes:
  strmhub_data:
  strmhub_config:
  strmhub_log:
  strmhub_media:
